[package]
name = "apdr"
version = "0.2.8"
edition = "2021"
default-run = "apdr"

[lib]
name = "apdr"
path = "src/lib.rs"

[[bin]]
name = "apdr"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
serde_json = "1.0"
once_cell = "1.19"
rusqlite = { version = "0.32", features = ["bundled"] }
tar = "0.4"
zstd = "0.13"
