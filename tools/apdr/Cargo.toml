[package]
name = "apdr"
version = "0.2.11"
edition = "2021"
default-run = "apdr"

[lib]
name = "apdr"
path = "src/lib.rs"

[[bin]]
name = "apdr"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
serde_json = "1.0"
once_cell = "1.19"
rusqlite = { version = "0.32", features = ["bundled"] }
tar = "0.4"
zstd = "0.13"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
