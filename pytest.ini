[pytest]
testpaths = tools/apdr/llm_py/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    integration: integration tests requiring network or Ollama
    unit: fast unit tests with mocking
    rust_contract: tests documenting Rust/Python boundary contracts
